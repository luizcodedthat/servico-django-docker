<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Produtos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 30px auto;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-info {
            padding: 15px;
        }
        .card-info h3 {
            margin: 0 0 8px;
            color: #222;
        }
        .card-info p {
            margin: 0;
            color: #009e5c;
            font-weight: bold;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <h1>🛒 Catálogo de Produtos</h1>
    <div class="catalogo">
        {% for produto in produtos %}
        <div class="card">
            <img src="{{ produto.imagem }}" alt="{{ produto.nome }}">
            <div class="card-info">
                <h3>{{ produto.nome }}</h3>
                <p>{{ produto.preco }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
